[package]
name = "teller"
description = "Blind Teller escrow: fiat-for-crypto orders settled by a signed enclave verdict"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
teller-core.workspace = true
hex.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
ed25519-dalek = "2"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
